[package]
name = "slopmop"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0"
candle-core = "0.11.0"
candle-nn = "0.11.0"
dirs = "6.0"
flate2 = "1.1"
hf-hub = { version = "1.0.0", features = ["blocking"] }
ignore = "0.4"
rusqlite = { version = "0.40.0", features = ["bundled", "load_extension"] }
serde = { version = "1.0", features = ["derive"] }
tar = "0.4"
tokenizers = "0.23.2"
tracing = "0.1"
ureq = "3.4"
tree-sitter = "0.27.0"
tree-sitter-go = "0.25.0"
